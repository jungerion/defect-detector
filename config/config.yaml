data:
  train_dir: "data/raw/train"
  test_dir: "data/raw/test"
  image_size: 128 # resize all images to 128x128 — keeps training fast
  batch_size: 32
  class_names: ["ok_front", "def_front"] # index 0, 1 — order matters, must match folder names

model:
  architecture: "resnet18" # resnet18 | simple_cnn
  pretrained: true # use ImageNet-pretrained weights (transfer learning)
  num_classes: 2
  save_path: "models/defect_model.pt"

train:
  epochs: 5
  learning_rate: 0.001
  random_seed: 42

api:
  host: "0.0.0.0"
  port: 8000
